<div class="card">

  <h2>Add Transaction</h2>

  <div class="form-grid">

    <div class="field">
      <label>Amount</label>
      <input
        type="number"
        [(ngModel)]="amount"
        placeholder="0.00"
        class="amount-input">
    </div>

    <div class="field">
      <label>Type</label>
      <select [(ngModel)]="type">
        <option value="expense">Expense</option>
        <option value="income">Income</option>
      </select>
    </div>

    <div class="field">
      <label>Account</label>
      <select [(ngModel)]="selectedAccountId">
        <option value="">Select account</option>
        <option *ngFor="let acc of accounts" [value]="acc.id">
          {{ acc.name }}
        </option>
      </select>
    </div>

    <div class="field">
      <label>Category</label>
      <select [(ngModel)]="categoryId">
        <option value="">None</option>
        <option *ngFor="let cat of categories" [value]="cat.id">
          {{ cat.name }}
        </option>
      </select>
    </div>

    <div class="field full">
      <label>Note</label>
      <input
        type="text"
        [(ngModel)]="note"
        placeholder="Optional note">
    </div>

    <div class="field">
      <label>Date</label>
      <input type="date" [(ngModel)]="occurred_at">
    </div>

  </div>

  <button
    class="primary-btn"
    (click)="submit()"
    [disabled]="loading">

    {{ loading ? 'Saving...' : 'Add Transaction' }}

  </button>

  <p class="message" *ngIf="message">
    {{ message }}
  </p>

</div>
