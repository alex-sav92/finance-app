<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">

  <!-- coin background -->
  <circle cx="50" cy="50" r="45" fill="#f59e0b"/>

  <!-- coin inner ring -->
  <circle cx="50" cy="50" r="35" fill="none" stroke="white" stroke-width="4"/>

  <!-- dollar symbol -->
  <text
    x="50"
    y="60"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="40"
    font-weight="bold"
    fill="white"
  >
    $
  </text>

</svg>